version: '3.9'

services:
  db:
    image: postgres:15
    container_name: challenger-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: challenger-backend
    restart: always
    env_file:
      - backend/.env
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  bot:
    build: ./bot
    container_name: challenger-bot
    restart: always
    env_file:
      - bot/.env
    depends_on:
      - backend
    volumes:
      - ./bot/app:/bot/app
    command: python app/main.py

volumes:
  postgres_data:
